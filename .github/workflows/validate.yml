name: Validate airspace JSON

on:
  push:
    branches: [main]
    paths:
      - '**/LOA.json'
      - '**/sector_ownership.json'
      - '**/volumes.json'
      - 'scripts/validate.js'
  pull_request:
    branches: [main]
    paths:
      - '**/LOA.json'
      - '**/sector_ownership.json'
      - '**/volumes.json'
      - 'scripts/validate.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run compatibility validation
        run: node scripts/validate.js
